[project]
name = "module-1-scapy"
version = "0.1.0"
description = "Système de détection et de prévention d'intrusion (IDS/IPS) avec Scapy"
authors = [
    {name = "Wany917", email = "yvannkakou03@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "scapy>=2.5.0",
    "pygal>=3.0.0",
    "fpdf>=1.7.2",
    "netifaces>=0.11.0",
    "colorlog (>=6.9.0,<7.0.0)",
    "cairosvg (>=2.8.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "module_1_scapy", from = "src"}]
license = "MIT"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pre-commit = "^4.2.0"
ruff = "^0.9.0"

[tool.poetry.scripts]
ids = "module_1_scapy.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py310"
select = ["E", "F", "B", "I", "W"]
